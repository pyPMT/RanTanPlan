[build-system]
requires = ["scikit-build-core>=0.10", "nanobind", "z3-solver"]
build-backend = "scikit_build_core.build"

[project]
name = "rantanplan"
version = "2.2"
authors = [
  { name="Joan Espasa Arxer", email="foo@bar.com" },
]
description = "An automated planner based on planning modulo theories"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "unified-planning>=1.2.0",
    "z3-solver",
]

[project.scripts]
rantanplan = "rantanplan.cli:main"

[project.urls]
"Homepage" = "https://github.com/pyPMT/rantanplan"
"Repository" = "https://github.com/pyPMT/rantanplan"

[tool.scikit-build]
# CMakeLists.txt lives with the C++ sources, not at the repo root
cmake.source-dir = "rantanplan/cpp"
# Persistent build tree outside the package dir -> incremental rebuilds
build-dir = "build/{wheel_tag}"
# make runs serial by default (ninja is deliberately not a dependency);
# match the old build.py's -j 4
build.tool-args = ["-j4"]
wheel.packages = ["rantanplan"]
# C++ sources ship in the sdist, not the wheel (the wheel carries the built .so)
wheel.exclude = ["rantanplan/cpp/**"]
sdist.exclude = [
    ".venv/",
    "build/",
    "pddl/",
    "rantanplan/cpp/build/",
    "scripts/",
    "test.py",
    "tests/",
    "*.so",
]
